name: E2E (Playwright)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer commit on the same ref cancels the older in-flight run — no more
# queue pile-ups when pushes land in quick succession. main is exempt so a
# deploy-validating run is never killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Mirror backend-ci.yml's Mongo service exactly.
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_DATABASE: ims_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    env:
      # The app reads MONGODB_URL and connects to database "ims_2_0" (the URI
      # path is ignored — see api/main.py). Seed + app therefore share one DB.
      MONGODB_URL: mongodb://localhost:27017/ims_test
      JWT_SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test
      # Allow the same-origin preview origin through CORS (belt-and-braces;
      # the /api proxy makes calls same-origin so this is rarely exercised).
      CORS_ORIGINS: http://localhost:4173
      # Backend the e2e API helper + gstMode() talk to directly.
      E2E_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Backend ----
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot backend (uvicorn)
        working-directory: backend
        run: |
          nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 \
            > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo "$!" > "$GITHUB_WORKSPACE/backend.pid"
          echo "Backend starting (pid $!)..."

      - name: Wait for backend health
        # NB: wait-on issues HEAD by default; /health is GET-only (returns 405
        # to HEAD) so the plain http:// scheme never reports ready. The
        # http-get:// scheme forces a GET and treats any 2xx as up.
        run: npx --yes wait-on -t 120000 http-get://localhost:8000/health

      - name: Confirm backend /health (and surface log on failure)
        run: |
          echo "Backend process: $(cat "$GITHUB_WORKSPACE/backend.pid" 2>/dev/null || echo '?')"
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          echo ""
          echo "pricing_mode -> $(grep -o '"pricing_mode":"[^"]*"' /tmp/health.json || true)"

      - name: Dump backend log if boot failed
        if: failure()
        run: |
          echo "===== backend.log (boot phase) ====="
          cat "$GITHUB_WORKSPACE/backend.log" || echo "(no backend.log)"

      - name: Seed E2E data
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/seed_e2e.py 2>&1 | tee "$GITHUB_WORKSPACE/seed.log"

      # ---- Frontend (build + serve same-origin with /api proxy) ----
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (relative API base -> same-origin /api proxy)
        working-directory: frontend
        env:
          # Force a relative API base so the built SPA hits the local backend
          # via the preview /api proxy — NEVER the Railway prod URL.
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Serve frontend (vite preview + /api proxy)
        working-directory: frontend
        env:
          E2E_BACKEND_URL: http://localhost:8000
        run: |
          nohup npx vite preview --config vite.preview.config.ts --port 4173 \
            > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          echo "Frontend preview starting (pid $!)..."

      - name: Wait for frontend + backend
        # http-get:// forces GET (see backend health note above); the FE root is
        # plain http:// (static index responds to HEAD).
        run: npx --yes wait-on -t 120000 http-get://localhost:8000/health http://localhost:4173

      # ---- Playwright ----
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci || npm install

      # ~150MB of chromium, re-downloaded on every run until now (25s of a
      # ~2.5min job). The key is the lockfile, so a Playwright bump busts it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # ---- The gate, in two invocations of ONE config ----
      # Layout/popup specs are READ-ONLY (navigate + measure), so they run wide.
      # Everything else mutates the seeded DB and stays at one worker. Both
      # steps are in this job, so both still report into the single `e2e` check.
      - name: Guard - every spec belongs to exactly one of the two runs
        working-directory: e2e
        run: |
          n () { npx playwright test --list "$@" 2>/dev/null | grep -oE 'Total: [0-9]+' | grep -oE '[0-9]+'; }
          all=$(n)
          run=$(n --project=layout --project=stateful)
          echo "the two runs cover $run of $all tests"
          if [ "$run" != "$all" ] || [ -z "$all" ]; then
            echo "::error::$((all - run)) test(s) would run in NEITHER lane - a spec or a project escapes the split"
            exit 1
          fi

      - name: Run layout probe (read-only, parallel)
        working-directory: e2e
        env:
          PW_HTML_DIR: playwright-report/layout
        run: npx playwright test --project=layout --workers=4

      - name: Run stateful specs (serial)
        # Always run, even if the layout probe failed, so one red screen never
        # hides a broken checkout flow.
        if: ${{ !cancelled() }}
        working-directory: e2e
        env:
          PW_HTML_DIR: playwright-report/stateful
        run: npx playwright test --project=stateful --workers=1

      # A `nohup ... &` server outlives its step. The runner tears the process
      # tree down at job end, but killing them explicitly keeps :4173 / :8000
      # free for anything added after this point and makes a wedged server a
      # visible line in the log rather than a mystery timeout.
      - name: Stop local servers
        if: ${{ !cancelled() }}
        run: |
          kill "$(cat "$GITHUB_WORKSPACE/backend.pid" 2>/dev/null)" 2>/dev/null || true
          pkill -f 'vite preview' 2>/dev/null || true
          echo "servers stopped"

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== backend.log ====="
          cat "$GITHUB_WORKSPACE/backend.log" || true
          echo "===== seed.log ====="
          cat "$GITHUB_WORKSPACE/seed.log" || true
          echo "===== frontend.log ====="
          cat "$GITHUB_WORKSPACE/frontend.log" || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 14
