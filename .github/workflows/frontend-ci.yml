name: Frontend Tests & Build

on:
  # No claude/** push trigger — PR branches run via pull_request only (see
  # backend-ci.yml for the rationale).
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: frontend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vite 7 (the build tool) requires Node 20.19+ / 22.12+, and Node 18
        # reached end-of-life in Apr 2025. Testing on 18.x failed at `vite build`
        # regardless of this branch; run the supported LTS lines instead.
        # One Node — a Vite build does not differ across 20/22, and the dual
        # matrix doubled every PR's frontend wall time.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run unit tests
        # These steps used to call `npm run test:unit` / `test:integration`,
        # scripts that were never defined -- `|| true` + continue-on-error
        # masked the missing-script error, so frontend tests silently never
        # ran in CI. This is the real vitest suite, and it gates the merge.
        run: npm run test:coverage -- --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Analyze bundle size
        run: |
          npm install -g bundlesize
          bundlesize
        continue-on-error: true

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 30

  dead-code:
    # Advisory only — knip reports unused files/exports/dependencies to the job
    # summary; it never blocks a merge and is not a required check.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Dead code report (knip)
        run: |
          npx knip --no-progress --reporter markdown >> "$GITHUB_STEP_SUMMARY" || true
          npx knip --no-progress || true
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --production
        continue-on-error: true

      - name: SAST with ESLint
        run: npm run lint:security
        continue-on-error: true

      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'IMS-2.0-Frontend'
          path: '.'
          format: 'JSON'
          args: >
            --enableExperimental
        continue-on-error: true
