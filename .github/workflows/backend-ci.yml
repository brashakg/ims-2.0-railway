name: Backend Tests & Build

on:
  # No claude/** push trigger: PR branches run via pull_request ONLY, so each
  # commit runs the suite once, not twice (the old dual-trigger doubled every
  # run and created the confusing two-runs-per-check merge gate).
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer commit on the same ref cancels the older in-flight run — no more
# queue pile-ups when pushes land in quick succession. main is exempt so a
# deploy-validating run is never killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_DATABASE: ims_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    strategy:
      # One Python (3.11 — prod runs newer; version drift is caught by the
      # Docker build), THREE balanced shards via pytest-split: wall time drops
      # from ~45 min x2 duplicated runs to ~15 min once.
      matrix:
        shard: [1, 2, 3]
    name: test (shard ${{ matrix.shard }})

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Metered minutes (private repo): a PR that touches no backend file
      # skips install+tests entirely — the required check still reports green
      # in ~30s. Push events (main/develop) always run the full suite.
      - name: Detect backend changes
        id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE "^(backend/|\.github/workflows/backend-ci)"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.diff.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        if: steps.diff.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-split==0.10.0

      - name: Lint with Black
        if: matrix.shard == 1 && steps.diff.outputs.backend == 'true' 
        run: black --check api/
        continue-on-error: true  # formatting is advisory

      - name: Lint with Pylint (errors only)
        # Pydantic v2 makes pylint unhappy in two unavoidable ways:
        #  - no-name-in-module (E0611) on `from pydantic import field_validator` —
        #    extension-pkg-allow-list covers BaseModel but not every sub-symbol.
        #  - no-member (E1101) on `instance.model_dump()` — methods are generated by
        #    the metaclass, invisible to static analysis.
        # Both are false positives; mypy + runtime tests catch real versions of these.
        if: matrix.shard == 1 && steps.diff.outputs.backend == 'true'
        run: pylint api/ --disable=all --enable=E,F --extension-pkg-allow-list=pydantic --disable=no-name-in-module,no-member

      - name: Type check with mypy
        if: matrix.shard == 1 && steps.diff.outputs.backend == 'true' 
        run: mypy api/
        continue-on-error: true  # gradual adoption

      - name: Run unit tests
        # No -x: run the WHOLE suite so one failure can't abort + mask the rest
        # (a single flake used to red the job and hide every test after it).
        if: steps.diff.outputs.backend == 'true'
        run: pytest tests/ --splits 3 --group ${{ matrix.shard }}
        env:
          MONGODB_URL: mongodb://localhost:27017/ims_test
          JWT_SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test

      - name: Run integration tests
        if: matrix.shard == 1 && steps.diff.outputs.backend == 'true'
        run: pytest tests/ -m integration
        env:
          MONGODB_URL: mongodb://localhost:27017/ims_test
          JWT_SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
        continue-on-error: true  # integration tests may need DB

  dead-code-complexity:
    # Advisory only — vulture (dead code, confidence >= 90) + radon (complexity
    # rank D or worse) report to the job summary; never blocks a merge and is
    # not a required check. Metered minutes: main pushes only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analyzers
        run: pip install vulture==2.14 radon==6.0.1

      - name: Dead code report (vulture)
        run: |
          {
            echo '## Backend dead code (vulture, confidence >= 90 — advisory)'
            echo '```'
            vulture api/ --min-confidence 90 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          vulture api/ --min-confidence 90 || true
        continue-on-error: true

      - name: Complexity report (radon, rank D+)
        run: |
          {
            echo '## Backend complexity hotspots (radon, rank D or worse — advisory)'
            echo '```'
            radon cc api/ -s -n D --total-average || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          radon cc api/ -s -n D --total-average || true
        continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security audit with Bandit
        run: bandit -r api/ -f json -o bandit-report.json -ll
        # -ll = MEDIUM severity and above; blocks merge on real vulnerabilities

      - name: Dependency check with Safety
        # safety 3.0.1 hit upstream incompat with newer click/typer (internal API changes);
        # keep the scan informational so it doesn't block merges on tooling rot.
        # Bandit above still blocks on MEDIUM+ code-level vulnerabilities.
        run: safety check --json > safety-report.json
        continue-on-error: true

      - name: SBOM generation
        run: pip install cyclonedx-bom && cyclonedx-py -o sbom.xml
        continue-on-error: true  # SBOM is informational

  build:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t ims-2.0-backend:${{ github.sha }} -f Dockerfile .
          docker tag ims-2.0-backend:${{ github.sha }} ims-2.0-backend:latest

      - name: Test Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker run --rm ims-2.0-backend:latest python -m pytest tests/ -m unit
        continue-on-error: true
